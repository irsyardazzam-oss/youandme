<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mutia ❤️ Azam</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', cursive;
    background: linear-gradient(180deg, #fff0f5, #ffd6e7);
    overflow: hidden;
}

/* LOGIN */
#login {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(255,105,180,0.3);
    z-index: 10;
}

input {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid pink;
    margin-top: 10px;
}

button {
    margin-top: 10px;
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: pink;
    color: white;
    cursor: pointer;
}

/* MAIN */
#main {
    display: none;
}

/* CONTAINER */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    animation: openLetter 1.5s ease forwards;
    text-align: center;
    padding: 25px;
    background: rgba(255,255,255,0.75);
    border-radius: 25px;
    backdrop-filter: blur(12px);
    width: 85%;
    max-width: 650px;
}

@keyframes openLetter {
    to { transform: translate(-50%, -50%) scale(1); }
}

h1 {
    color: #ff4da6;
}

#text {
    color: #444;
    line-height: 1.8;
    min-height: 120px;
}

.slideshow img {
    width: 100%;
    max-height: 350px; /* Agar foto tidak terlalu besar */
    object-fit: cover;
    border-radius: 15px;
    display: none;
    margin-top: 15px;
}

/* LOVE RAIN */
.heart {
    position: absolute;
    color: pink;
    animation: fall linear infinite;
}
@keyframes fall {
    0% { transform: translateY(-10vh); }
    100% { transform: translateY(110vh); }
}

/* EXPLODE */
.explode {
    position: absolute;
    color: hotpink;
    animation: boom 0.6s forwards;
}
@keyframes boom {
    to { transform: scale(3); opacity: 0; }
}
</style>
</head>

<body>

<div id="login">
    <h2>Masukin Password 💗</h2>
    <input type="password" id="pass" placeholder="password...">
    <br>
    <button onclick="checkPass()">Masuk</button>
</div>

<div id="main">
    <div class="container">
        <h1>Mutia ❤️ Azam</h1>
        <p id="text"></p>

        <button id="btnMusic" onclick="playMusic()">Putar Lagu 🎶</button>

        <div class="slideshow">
            <img src="135318.jpg"> <img src="135319.jpg"> <img src="IMG_20260429_192002_231.jpg"> <img src="IMG_20260429_192028_200.jpg"> </div>
    </div>
</div>

<audio id="music" loop>
    <source src="ssstik.io_1777463615311.mp3" type="audio/mpeg">
</audio>

<script>
/* PASSWORD */
function checkPass(){
    let input = document.getElementById("pass").value;
    // Password sesuai permintaan kamu
    if(input === '28"kita"'){
        document.getElementById("login").style.display = "none";
        document.getElementById("main").style.display = "block";
        typing();
        playMusic(); // Coba putar otomatis setelah login
    } else {
        alert("Password salah 😢");
    }
}

/* TEXT */
const textContent = `aku menyembunyikanmu diantara bait-bait yang hanya aku yang tau letaknya,
jika kamu bertanya mengapa tidak aku utarakan saja maka aku akan menjawab
"biarlah dia ada dalam bait-bait yang sewaktu-waktu dapat aku buka dan kembali pada masa yang ada kamu didalamnya
karena setiap detik yang selalu memetik aku tidak akan pernah mengetahui apa kita akan bertemu kembali pada garis takdir ."`;

let i = 0;
function typing(){
    if(i < textContent.length){
        document.getElementById("text").innerHTML += textContent.charAt(i);
        i++;
        setTimeout(typing, 35);
    }
}

/* MUSIC */
function playMusic(){
    let audio = document.getElementById("music");
    audio.play().catch(error => {
        console.log("Autoplay dicegah browser, silakan klik tombol Putar Lagu.");
    });
}

/* LOVE RAIN */
setInterval(()=>{
    let h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💗";
    h.style.left = Math.random()*window.innerWidth+"px";
    h.style.fontSize = (15+Math.random()*20)+"px";
    h.style.animationDuration = (3+Math.random()*5)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),8000);
},300);

/* CLICK LOVE EFFECT */
document.addEventListener("click",(e)=>{
    for(let j=0; j<6; j++){
        let b = document.createElement("div");
        b.className="explode";
        b.innerHTML="💖";
        b.style.left=e.clientX+"px";
        b.style.top=e.clientY+"px";
        document.body.appendChild(b);
        setTimeout(()=>b.remove(),600);
    }
});

/* SLIDESHOW */
let slideIndex = 0;
function showSlides(){
    const slides = document.querySelectorAll(".slideshow img");
    slides.forEach(s => s.style.display = "none");
    slideIndex++;
    if(slideIndex > slides.length) slideIndex = 1;
    if(slides[slideIndex-1]) {
        slides[slideIndex-1].style.display = "block";
    }
    setTimeout(showSlides, 3000);
}
showSlides();
</script>

</body>
</html>
